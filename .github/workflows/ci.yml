name: CI

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validar JSON de contenido
        run: |
          node -e "
          const fs = require('fs');
          const dirs = ['docs/aventuras', 'docs'];
          let n = 0;
          for (const dir of dirs) {
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith('.json')) continue;
              JSON.parse(fs.readFileSync(\`\${dir}/\${f}\`, 'utf8'));
              n++;
            }
          }
          console.log(\`\${n} ficheros JSON válidos\`);
          "
