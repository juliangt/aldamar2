name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage a ejecutar ("all" para ejecutar el pipeline completo)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'validate'
          - 'unit'
          - 'integration'
          - 'e2e'
          - 'build'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.stage || 'auto' }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Validación Sintáctica y de Datos JSON
  # -------------------------------------------------------------
  validate:
    name: 'Stage 1: Validar Sintaxis y JSON'
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.stage == 'all' ||
      github.event.inputs.stage == 'validate'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar ficheros JSON de contenido
        run: node tools/validar-datos.js

  # -------------------------------------------------------------
  # STAGE 2: Tests Unitarios
  # -------------------------------------------------------------
  unit:
    name: 'Stage 2: Tests Unitarios'
    runs-on: ubuntu-latest
    needs: [validate]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.stage == 'all' || github.event.inputs.stage == 'unit') &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'unit' || needs.validate.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Tests Unitarios
        run: npm run test:unit

  # -------------------------------------------------------------
  # STAGE 3: Tests de Integración
  # -------------------------------------------------------------
  integration:
    name: 'Stage 3: Tests de Integración'
    runs-on: ubuntu-latest
    needs: [unit]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.stage == 'all' || github.event.inputs.stage == 'integration') &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'integration' || needs.unit.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Tests de Integración
        run: npm run test:integration

  # -------------------------------------------------------------
  # STAGE 4: Tests E2E (Playwright) — Temporalmente desactivado
  # -------------------------------------------------------------
  # e2e:
  #   name: 'Stage 4: Tests E2E (Playwright)'
  #   runs-on: ubuntu-latest
  #   needs: [integration]
  #   if: |
  #     always() &&
  #     (github.event_name != 'workflow_dispatch' || github.event.inputs.stage == 'all' || github.event.inputs.stage == 'e2e') &&
  #     (github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'e2e' || needs.integration.result == 'success')
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: npm
  #
  #     - name: Instalar dependencias
  #       run: npm ci
  #
  #     - name: Instalar navegadores Playwright
  #       run: npx playwright install chromium --with-deps
  #
  #     - name: Ejecutar Tests E2E
  #       run: npm run test:e2e
  #
  #     - name: Subir reporte Playwright en caso de fallo
  #       uses: actions/upload-artifact@v4
  #       if: failure()
  #       with:
  #         name: playwright-report
  #         path: playwright-report/
  #         retention-days: 7

  # -------------------------------------------------------------
  # STAGE 5: Compilación de Producción
  # -------------------------------------------------------------
  build:
    name: 'Stage 5: Compilación de Producción'
    runs-on: ubuntu-latest
    needs: [validate]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.stage == 'all' || github.event.inputs.stage == 'build') &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'build' || needs.validate.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar bundle de producción
        run: npm run build

      - name: Subir artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
